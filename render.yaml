services:
  - type: web
    name: aida-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:api
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
